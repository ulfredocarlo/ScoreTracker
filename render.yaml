databases:
  - name: scoretracker-db
    plan: free
    databaseName: scoretracker
    user: scoretracker_user

services:
  - type: web
    name: scoretracker-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scoretracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
